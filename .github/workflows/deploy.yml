name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
 
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Engine tests import functions/src modules (resolve from functions/node_modules)
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          # Firebase AI Logic (photo → card recognition). App Check is enforced for
          # AI Logic, so the reCAPTCHA Enterprise site key is required in production.
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_GEMINI_MODEL: ${{ vars.VITE_GEMINI_MODEL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # The frontend must never go live ahead of the rules it writes against (e.g.
  # the roster `rev` field is rejected by older rules). firebase-deploy.yml also
  # deploys rules, but only after the functions deploy — minutes after Pages
  # would publish. So rules are tested and released here first; releasing the
  # same ruleset twice is harmless.
  firestore-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests
        run: npm run test:rules

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --force --project poker-ledger-a0e06

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, firestore-rules]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
